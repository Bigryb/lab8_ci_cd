name: Lab 8 - Docker (medium)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/lab8_ci_cd
          flavor: |
            latest=auto
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag

      - name: Build and publish Docker image with layer cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test healthcheck and non-root user
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          IMAGE="$DOCKER_USERNAME/lab8_ci_cd:${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker image ls "$IMAGE"
          docker run -d --name lab8-check -p 127.0.0.1:8000:8000 "$IMAGE"
          trap 'docker rm -f lab8-check >/dev/null 2>&1 || true' EXIT

          echo "Container UID:"
          docker exec lab8-check id -u
          if [ "$(docker exec lab8-check id -u)" = "0" ]; then
            echo "::error::Container runs as root"
            docker logs lab8-check
            exit 1
          fi

          for attempt in {1..20}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' lab8-check)"
            echo "Health status: $health (attempt $attempt)"

            if [ "$health" = "healthy" ]; then
              curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/health
              echo
              echo "Healthcheck OK. Non-root OK."
              exit 0
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' lab8-check)" != "true" ]; then
              echo "::error::Container stopped unexpectedly"
              docker logs lab8-check
              exit 1
            fi

            sleep 3
          done

          echo "::error::Container did not become healthy"
          docker inspect --format '{{json .State.Health}}' lab8-check
          docker logs lab8-check
          exit 1
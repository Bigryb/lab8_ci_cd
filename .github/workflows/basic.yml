name: Lab 8 - Docker (basic)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate short commit hash
        id: version
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lab8_ci_cd:${{ steps.version.outputs.sha }}

      - name: Test published Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ steps.version.outputs.sha }}
        run: |
          IMAGE="$DOCKER_USERNAME/lab8_ci_cd:$IMAGE_TAG"

          docker pull "$IMAGE"
          docker image ls "$IMAGE"

          docker run -d --name lab8-check \
            -p 127.0.0.1:8000:8000 "$IMAGE"

          trap 'docker rm -f lab8-check >/dev/null 2>&1 || true' EXIT

          for attempt in {1..15}; do
            echo "Проверка запуска Flask: попытка $attempt"

            if curl -fsS --max-time 3 http://127.0.0.1:8000/health; then
              echo
              echo "Flask работает успешно!"
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' lab8-check)" != "true" ]; then
              echo "Контейнер неожиданно завершился."
              docker logs lab8-check
              exit 1
            fi

            sleep 2
          done

          echo "Flask не ответил за отведенное время."
          docker logs lab8-check
          exit 1
          